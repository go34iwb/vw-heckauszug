<!-- ========== THREE.JS 3D INTERACTIVE VIEW ========== -->
    <div class="view-card">
        <div class="view-title">5. 3D Interaktiv (Three.js WebGL — OrbitControls: Maus=rotieren, Rad=zoomen, Shift+Maus=pan)</div>
        <div class="svg-wrap" style="padding: 0;">
            <div id="threejs-canvas" style="width: 100%; height: 600px; position: relative;"></div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@latest/build/three.module.js';
        import { OrbitControls } from 'https://unpkg.com/three@latest/examples/jsm/controls/OrbitControls.js';

        // Module stack definitions (z in mm, bottom to top)
        const MODULES = [
            // Modul 1 (Links): x = 0-310
            {
                x: 0, width: 310, depth: 600,
                layers: [
                    { name: 'Auszug', z: 0, h: 590, color: 0xbdbdbd, emissive: 0x333333 },
                    { name: 'U-Profil auf Auszug', z: 20, h: 70, color: 0xe8f5e9, emissive: 0x1b5e20 },
                    { name: 'Bierbank IN U', z: 20, h: 40, color: 0xd7ccc8, emissive: 0x6d4c41 },
                    { name: 'Brett AUF U', z: 90, h: 15, color: 0x8d6e63, emissive: 0x3e2723 },
                    { name: 'Eurobox 1', z: 105, h: 220, color: 0xbbdefb, emissive: 0x0d47a1 },
                    { name: 'Eurobox 2', z: 325, h: 220, color: 0xbbdefb, emissive: 0x0d47a1 },
                    { name: 'Deckel 15mm', z: 545, h: 15, color: 0x6d4c41, emissive: 0x3e2723 },
                ]
            },
            // Modul 2 (Mitte): x = 310-810
            {
                x: 310, width: 500, depth: 600,
                layers: [
                    { name: 'Auszug', z: 0, h: 590, color: 0xbdbdbd, emissive: 0x333333 },
                    { name: 'Brett dropped', z: 20, h: 15, color: 0x8d6e63, emissive: 0x3e2723 },
                    { name: 'Kühlbox', z: 35, h: 490, color: 0xffe0b2, emissive: 0xbf360c },
                ]
            },
            // Modul 3 (Rechts): x = 810-1120
            {
                x: 810, width: 310, depth: 600,
                layers: [
                    { name: 'Auszug', z: 0, h: 590, color: 0xbdbdbd, emissive: 0x333333 },
                    { name: 'U-Profil auf Auszug', z: 20, h: 70, color: 0xe8f5e9, emissive: 0x1b5e20 },
                    { name: 'Bierbank IN U', z: 20, h: 40, color: 0xd7ccc8, emissive: 0x6d4c41 },
                    { name: 'Brett AUF U', z: 90, h: 15, color: 0x8d6e63, emissive: 0x3e2723 },
                    { name: 'Eurobox 1', z: 105, h: 220, color: 0xbbdefb, emissive: 0x0d47a1 },
                    { name: 'Eurobox 2', z: 325, h: 220, color: 0xbbdefb, emissive: 0x0d47a1 },
                    { name: 'Deckel 15mm', z: 545, h: 15, color: 0x6d4c41, emissive: 0x3e2723 },
                ]
            }
        ];

        let scene, camera, renderer, controls;
        let animationId = null;
        let canvas = null;

        function initThreeJS() {
            const container = document.getElementById('threejs-canvas');
            if (!container) {
                console.warn('Three.js container not found');
                return;
            }

            // Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0xf5f5f5);

            // Camera
            const aspect = container.clientWidth / 600;
            camera = new THREE.PerspectiveCamera(50, aspect, 1, 5000);
            camera.position.set(600, 800, 1000);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, 600);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);
            canvas = renderer.domElement;

            // OrbitControls
            controls = new OrbitControls(camera, canvas);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.screenSpacePanning = false;
            controls.minDistance = 300;
            controls.maxDistance = 2500;
            controls.maxPolarAngle = Math.PI / 2 - 0.01;
            controls.target.set(600, 300, 300);

            // Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1);
            dirLight.position.set(500, 1000, 500);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048;
            dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 1;
            dirLight.shadow.camera.far = 2000;
            dirLight.shadow.camera.left = -800;
            dirLight.shadow.camera.right = 800;
            dirLight.shadow.camera.top = 800;
            dirLight.shadow.camera.bottom = -800;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
            fillLight.position.set(-500, 300, -500);
            scene.add(fillLight);

            // Ground plane
            const groundGeo = new THREE.PlaneGeometry(2000, 2000);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.9, metalness: 0 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.y = -1;
            ground.receiveShadow = true;
            scene.add(ground);

            // Build modules
            buildModules();

            // Axis helper
            const axes = new THREE.AxesHelper(300);
            scene.add(axes);

            // Grid helper
            const grid = new THREE.GridHelper(1500, 30, 0xcccccc, 0xeeeeee);
            grid.position.y = -1;
            scene.add(grid);

            // Module labels (HTML overlays)
            addModuleLabels();

            // Handle resize
            window.addEventListener('resize', onResize);

            // Start animation
            animate();
        }

        function buildModules() {
            const profileWidth = 40;
            const profileDepth = 20;

            MODULES.forEach(mod => {
                const group = new THREE.Group();
                group.position.x = mod.x + mod.width / 2;
                group.position.z = mod.depth / 2;
                scene.add(group);

                // Längsträger (hochkant 20x40) - front & back
                const lngMat = new THREE.MeshStandardMaterial({ 
                    color: 0x333333, 
                    roughness: 0.3, 
                    metalness: 0.8 
                });

                for (let i = 0; i < 2; i++) {
                    const xOffset = i === 0 ? -mod.width / 2 + 10 : mod.width / 2 - 30;
                    const lngGeo = new THREE.BoxGeometry(profileWidth, 590, profileDepth);
                    const lng = new THREE.Mesh(lngGeo, lngMat);
                    lng.position.set(xOffset, 295, -mod.depth / 2 + 10);
                    lng.castShadow = true;
                    lng.receiveShadow = true;
                    group.add(lng);
                }
                for (let i = 0; i < 2; i++) {
                    const xOffset = i === 0 ? -mod.width / 2 + 10 : mod.width / 2 - 30;
                    const lngGeo = new THREE.BoxGeometry(profileWidth, 590, profileDepth);
                    const lng = new THREE.Mesh(lngGeo, lngMat);
                    lng.position.set(xOffset, 295, mod.depth / 2 - 10);
                    lng.castShadow = true;
                    lng.receiveShadow = true;
                    group.add(lng);
                }

                // Querträger (flach 20x40) - bottom & top
                const qtrMat = new THREE.MeshStandardMaterial({ 
                    color: 0x222222, 
                    roughness: 0.3, 
                    metalness: 0.8 
                });

                const qtrGeo = new THREE.BoxGeometry(mod.width - 20, 20, mod.depth - 20);
                const qtr1 = new THREE.Mesh(qtrGeo, qtrMat);
                qtr1.position.set(0, 10, 0);
                qtr1.castShadow = true;
                qtr1.receiveShadow = true;
                group.add(qtr1);

                const qtr2 = new THREE.Mesh(qtrGeo, qtrMat);
                qtr2.position.set(0, 580, 0);
                qtr2.castShadow = true;
                qtr2.receiveShadow = true;
                group.add(qtr2);

                // Module divider lines
                if (mod.x === 310 || mod.x === 810) {
                    const divGeo = new THREE.PlaneGeometry(2, 590);
                    const divMat = new THREE.MeshBasicMaterial({ 
                        color: 0x333333, 
                        transparent: true, 
                        opacity: 0.3,
                        side: THREE.DoubleSide
                    });
                    const div = new THREE.Mesh(divGeo, divMat);
                    div.position.set(-mod.width / 2, 295, 0);
                    div.rotation.y = Math.PI / 2;
                    group.add(div);
                }

                // Auszüge (GTV H53) - main structural rails, full height
                const sliderMat = new THREE.MeshStandardMaterial({ 
                    color: 0xbdbdbd, 
                    roughness: 0.4, 
                    metalness: 0.7 
                });

                const sliderGeo = new THREE.BoxGeometry(19.5, 590, 50);
                const sliderPositions = [
                    { x: -mod.width / 2 + 10, z: -mod.depth / 2 + 25 },
                    { x: mod.width / 2 - 29.5, z: -mod.depth / 2 + 25 },
                    { x: -mod.width / 2 + 10, z: mod.depth / 2 - 25 },
                    { x: mod.width / 2 - 29.5, z: mod.depth / 2 - 25 },
                ];

                sliderPositions.forEach(pos => {
                    const slider = new THREE.Mesh(sliderGeo, sliderMat);
                    slider.position.set(pos.x, 295, pos.z);
                    slider.castShadow = true;
                    slider.receiveShadow = true;
                    group.add(slider);
                });

                // Build stack layers
                mod.layers.forEach(layer => {
                    if (layer.name === 'Auszug') return; // Already built

                    let mesh;
                    const layerMat = new THREE.MeshStandardMaterial({ 
                        color: layer.color,
                        emissive: layer.emissive,
                        emissiveIntensity: 0.05,
                        roughness: layer.name.includes('Bierbank') ? 0.8 : 0.5,
                        metalness: layer.name.includes('Auszug') || layer.name.includes('U-Profil') ? 0.6 : 0.1,
                        transparent: layer.name.includes('Bierbank'),
                        opacity: layer.name.includes('Bierbank') ? 0.95 : 1
                    });

                    let geom;
                    if (layer.name.includes('U-Profil')) {
                        geom = new THREE.BoxGeometry(mod.width - 40, layer.h, mod.depth - 40);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    } else if (layer.name.includes('Bierbank')) {
                        geom = new THREE.BoxGeometry(230, layer.h, mod.depth - 80);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    } else if (layer.name.includes('Brett')) {
                        geom = new THREE.BoxGeometry(mod.width - 20, layer.h, mod.depth - 20);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    } else if (layer.name.includes('Eurobox')) {
                        geom = new THREE.BoxGeometry(250, layer.h, mod.depth - 60);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    } else if (layer.name.includes('Kühlbox')) {
                        geom = new THREE.BoxGeometry(mod.width - 60, layer.h, mod.depth - 60);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    } else {
                        geom = new THREE.BoxGeometry(mod.width - 20, layer.h, mod.depth - 20);
                        mesh = new THREE.Mesh(geom, layerMat);
                        mesh.position.set(0, layer.z + layer.h / 2, 0);
                    }

                    if (mesh) {
                        mesh.castShadow = true;
                        mesh.receiveShadow = true;
                        const edges = new THREE.EdgesGeometry(geom);
                        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, opacity: 0.15, transparent: true });
                        const edgeMesh = new THREE.LineSegments(edges, edgeMat);
                        edgeMesh.position.copy(mesh.position);
                        group.add(edgeMesh);
                        group.add(mesh);
                    }
                });
            });
        }

        function addModuleLabels() {
            const labels = [
                { x: 155, z: 300, text: 'Modul 1 (Links)\n310mm\nEuroboxen' },
                { x: 560, z: 300, text: 'Modul 2 (Mitte)\n500mm\nKühlbox' },
                { x: 965, z: 300, text: 'Modul 3 (Rechts)\n310mm\nEuroboxen' }
            ];

            labels.forEach(label => {
                const div = document.createElement('div');
                div.style.cssText = `
                    position: absolute;
                    color: #2c3e50;
                    font-weight: 600;
                    font-size: 14px;
                    text-align: center;
                    pointer-events: none;
                    text-shadow: 0 0 3px rgba(255,255,255,0.8);
                    white-space: pre-line;
                    transform: translate(-50%, -50%);
                `;
                div.textContent = label.text;
                label.div = div;
                canvas.parentElement.appendChild(div);
            });

            window.moduleLabels = labels;
        }

        function onResize() {
            if (!camera || !renderer) return;
            const container = document.getElementById('threejs-canvas');
            if (!container) return;

            const width = container.clientWidth;
            const height = 600;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        }

        function updateLabels() {
            if (!window.moduleLabels || !canvas) return;
            const rect = canvas.getBoundingClientRect();

            window.moduleLabels.forEach(label => {
                const vector = new THREE.Vector3(label.x, 300, label.z);
                vector.project(camera);

                const x = (vector.x * 0.5 + 0.5) * rect.width;
                const y = (-(vector.y * 0.5) + 0.5) * rect.height;

                label.div.style.left = `${x}px`;
                label.div.style.top = `${y}px`;
            });
        }

        function animate() {
            animationId = requestAnimationFrame(animate);

            controls.update();
            updateLabels();

            renderer.render(scene, camera);
        }

        function cleanup() {
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            window.removeEventListener('resize', onResize);

            if (renderer) {
                renderer.dispose();
                const container = document.getElementById('threejs-canvas');
                if (container && canvas) {
                    container.removeChild(canvas);
                }
            }

            if (scene) {
                scene.traverse(obj => {
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(m => m.dispose());
                        } else {
                            obj.material.dispose();
                        }
                    }
                });
            }
        }

        // Initialize on DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initThreeJS);
        } else {
            initThreeJS();
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', cleanup);
    </script>
</body>
</html>
