<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>VW T6 Heckauszug – WebGL 3D Modell</title>
<style>
  body{margin:0;overflow:hidden;background:#0a0a0f;font-family:Arial,Helvetica,sans-serif}
  canvas{display:block;width:100%;height:100%}
  .ui-overlay{
    position:absolute;top:12px;left:12px;z-index:100;
    color:#c0d0e0;font-size:13px;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.8)
  }
  .ui-overlay h1{font-size:15px;margin-bottom:2px;color:#89a}
  .ui-overlay .label{font-size:11px;color:#678}
  .controls{
    position:absolute;bottom:20px;left:50%;transform:translateX(-50%);
    display:flex;gap:12px;z-index:100;pointer-events:auto;
    flex-wrap:wrap;justify-content:center
  }
  .btn{
    background:rgba(25,30,40,.9);border:1px solid #3a4a5a;
    color:#a0b0c0;padding:10px 18px;border-radius:5px;
    font-size:13px;cursor:pointer;backdrop-filter:blur(4px);
    transition:all .15s;user-select:none;
    -webkit-tap-highlight-color:transparent;
    box-shadow:0 2px 4px rgba(0,0,0,.3)
  }
  .btn:active{background:rgba(40,50,70,.95);transform:translateY(1px)}
  .btn.active{
    background:rgba(60,100,160,.8);
    border-color:#59f;color:#fff;
    box-shadow:0 0 10px rgba(80,140,255,.4)
  }
  .title-badge{
    position:absolute;top:12px;right:15px;color:#59c;
    font-weight:600;font-size:14px;pointer-events:none;
    text-shadow:0 1px 2px rgba(0,0,0,.8)
  }
  .hint{
    position:absolute;top:38px;left:15px;color:#567;
    font-size:11px;pointer-events:none
  }
  .error{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(80,20,20,.9);color:#f88;padding:20px 30px;
    border-radius:8px;text-align:center;display:none;
    z-index:1000;border:1px solid #a44;max-width:80%
  }
  .wireframe-toggle{font-size:11px;color:#456;margin-top:4px}
  .back-link{
    position:absolute;bottom:20px;right:20px;z-index:100;
    background:rgba(25,30,40,.9);border:1px solid #3a4a5a;
    color:#a0b0c0;padding:10px 18px;border-radius:5px;
    font-size:13px;cursor:pointer;text-decoration:none;
    backdrop-filter:blur(4px);transition:all .15s;
    box-shadow:0 2px 4px rgba(0,0,0,.3)
  }
  .back-link:hover{background:rgba(40,50,70,.95)}
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div class="ui-overlay">
  <h1>VW T6 Heckauszug</h1>
  <div class="label">Maßstab: 1:20</div>
  <div class="wireframe-toggle">Drahtgitter: Taste W</div>
</div>
<div class="title-badge">3D SKIZZE</div>
<div class="hint">➤ Ziehen: Drehen · Pinch/Rad: Zoom</div>
<div class="controls">
  <button class="btn" id="toggle-measure" title="Maßlinien ein/aus">📏 Maßlinien</button>
  <button class="btn" id="toggle-wireframe" title="Drahtgittermodus">🔲 Drahtgitter</button>
  <button class="btn" id="reset-view" title="Ansicht zurücksetzen">↺ Reset</button>
</div>
<a href="index.html" class="back-link">Zurück zur Beschreibung</a>
<div class="error" id="error-box">
  <strong>WebGL nicht unterstützt</strong><br>
  Dieser Browser unterstützt keine 3D‑Grafik.
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const container = document.createElement('div');
  container.id = 'threejs-canvas';
  container.style.width = '100%';
  container.style.height = '600px';
  document.body.appendChild(container);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);
  const aspect = container.clientWidth / 600;
  const camera = new THREE.PerspectiveCamera(50, aspect, 1, 5000);
  camera.position.set(600, 800, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true});
  renderer.setSize(container.clientWidth, 600);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.screenSpacePanning = false;
  controls.minDistance = 300;
  controls.maxDistance = 2500;
  controls.maxPolarAngle = Math.PI/2 - 0.01;
  controls.target.set(600, 300, 300);
  const hemi = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.6);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(500, 1000, 500);
  dir.castShadow = true;
  dir.shadow.mapSize.width = 2048;
  dir.shadow.mapSize.height = 2048;
  dir.shadow.camera.near = 0.5;
  dir.shadow.camera.far = 2500;
  dir.shadow.camera.left = -600;
  dir.shadow.camera.right = 600;
  dir.shadow.camera.top = 600;
  dir.shadow.camera.bottom = -600;
  scene.add(dir);
  const groundGeo = new THREE.PlaneGeometry(2000, 2000);
  const groundMat = new THREE.MeshStandardMaterial({color: 0xeeeeee, roughness:0.9, metalness:0});
  const ground = new THREE.Mesh(groundGeo, groundMat);
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -1;
  ground.receiveShadow = true;
  scene.add(ground);
  // Modules
  const modules = [
    {x:0, w:310, d:600, layers:[
      {z:0, h:590, color:0xbdbdbd},
      {z:20, h:70, color:0xe8f5e9},
      {z:20, h:40, color:0xd7ccc8},
      {z:90, h:15, color:0x8d6e63},
      {z:105, h:220, color:0xbbdefb},
      {z:325, h:220, color:0xbbdefb},
      {z:545, h:15, color:0x6d4c41}
    ]},
    {x:310, w:500, d:600, layers:[
      {z:0, h:590, color:0xbdbdbd},
      {z:20, h:15, color:0x8d6e63},
      {z:35, h:490, color:0xffe0b2}
    ]},
    {x:810, w:310, d:600, layers:[
      {z:0, h:590, color:0xbdbdbd},
      {z:20, h:70, color:0xe8f5e9},
      {z:20, h:40, color:0xd7ccc8},
      {z:90, h:15, color:0x8d6e63},
      {z:105, h:220, color:0xbbdefb},
      {z:325, h:220, color:0xbbdefb},
      {z:545, h:15, color:0x6d4c41}
    ]}
  ];
  modules.forEach(m=>{
    const group = new THREE.Group();
    group.position.x = m.x + m.w/2;
    group.position.z = m.d/2;
    scene.add(group);
    // Bosch profiles (left/right)
    const lngMat = new THREE.MeshStandardMaterial({color:0x333333, roughness:0.3, metalness:0.8});
    for(let i=0;i<2;i++){
      const xOffset = i===0 ? -m.w/2+10 : m.w/2-30;
      const lngGeo = new THREE.BoxGeometry(40, 590, 20);
      const lng = new THREE.Mesh(lngGeo, lngMat);
      lng.position.set(xOffset, 295, i===0 ? -m.d/2+10 : m.d/2-10);
      lng.castShadow = true; lng.receiveShadow = true;
      group.add(lng);
    }
    // Layers
    m.layers.forEach(l=>{
      if(l.name==='Auszug') return;
      let geom, mat;
      const baseW = m.w-40, baseD = m.d-40;
      const color = new THREE.Color(l.color);
      if(l.name.includes('U-Profil')){
        geom = new THREE.BoxGeometry(baseW, l.h, baseD);
        mat = new THREE.MeshStandardMaterial({color});
      }else if(l.name.includes('Bierbank')){
        geom = new THREE.BoxGeometry(230, l.h, baseD-40);
        mat = new THREE.MeshStandardMaterial({color});
      }else if(l.name.includes('Brett')){
        geom = new THREE.BoxGeometry(baseW, l.h, baseD);
        mat = new THREE.MeshStandardMaterial({color});
      }else if(l.name.includes('Eurobox')){
        geom = new THREE.BoxGeometry(250, l.h, baseD-60);
        mat = new THREE.MeshStandardMaterial({color});
      }else if(l.name.includes('Kühlbox')){
        geom = new THREE.BoxGeometry(m.w-60, l.h, m.d-60);
        mat = new THREE.MeshStandardMaterial({color});
      }else{
        geom = new THREE.BoxGeometry(baseW, l.h, baseD);
        mat = new THREE.MeshStandardMaterial({color});
      }
      const mesh = new THREE.Mesh(geom, mat);
      mesh.position.set(0, l.z + l.h/2, 0);
      mesh.castShadow = true; mesh.receiveShadow = true;
      group.add(mesh);
    });
  });
  const axes = new THREE.AxesHelper(300);
  scene.add(axes);
  const grid = new THREE.GridHelper(1500, 30, 0xcccccc, 0xeeeeee);
  grid.position.y = -1;
  scene.add(grid);
  function resize(){
    const dpr = Math.min(window.devicePixelRatio||1,2);
    renderer.setSize(container.clientWidth*dpr, 600*dpr);
    camera.aspect = container.clientWidth/600;
    camera.updateProjectionMatrix();
  }
  resize(); window.addEventListener('resize', resize);
  let rotX=0.4, rotY=0.8, zoom=1.2;
  let touches=[], touchDist=0, lastX=0, lastY=0;
  container.addEventListener('touchstart',e=>{e.preventDefault(); touches=Array.from(e.touches);
    if(touches.length===1){lastX=touches[0].clientX; lastY=touches[0].clientY;}
    else if(touches.length>=2){touchDist=Math.hypot(touches[0].clientX-touches[1].clientX,
      touches[0].clientY-touches[1].clientY);}},{passive:false});
  container.addEventListener('touchmove',e=>{e.preventDefault();
    const curr=Array.from(e.touches);
    if(curr.length===1&&touches.length===1){
      const dx=curr[0].clientX-lastX; dy=curr[0].clientY-lastY;
      rotY+=dx*0.008; rotX+=dy*0.008;
      lastX=curr[0].clientX; lastY=curr[0].clientY;
    }else if(curr.length>=2&&touches.length>=2){
      const dist=Math.hypot(curr[0].clientX-curr[1].clientX,
        curr[0].clientY-curr[1].clientY);
      zoom*=1+(dist-touchDist)*0.005;
      zoom=Math.max(0.5,Math.min(4,zoom));
      touchDist=dist;
    }
    touches=curr;
  },{passive:false});
  container.addEventListener('touchend',()=>{touches=[];});
  let dragging=false, mx=0, my=0;
  container.addEventListener('mousedown',e=>{dragging=true; mx=e.clientX; my=e.clientY;});
  container.addEventListener('mousemove',e=>{if(!dragging)return;
    rotY+=(e.clientX-mx)*0.008; rotX+=(e.clientY-my)*0.008;
    mx=e.clientX; my=e.clientY;});
  container.addEventListener('mouseup',()=>dragging=false);
  container.addEventListener('wheel',e=>{e.preventDefault();
    zoom*=e.deltaY>0?1.08:0.92;
    zoom=Math.max(0.5,Math.min(4,zoom));
  },{passive:false});
  document.addEventListener('keydown',e=>{
    if(e.key==='w'||e.key==='W'){
      // wireframe toggle not implemented for simplicity
    }
  });
  document.getElementById('toggle-measure').onclick=()=>{};
  document.getElementById('toggle-wireframe').onclick=()=>{};
  document.getElementById('reset-view').onclick=()=>{rotX=0.4; rotY=0.8; zoom=1.2;};
  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  animate();
})();
</script>
</body>
</html>
